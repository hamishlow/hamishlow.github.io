<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bryce Canyon - The Stirling Stumble</title>
  <link rel="stylesheet" href="stumble.css">
</head>
<body class="bryce">
  <div class="tartan-accent"></div>
  <div class="topnav"><a href="./">&larr; All Stumble races</a></div>

  <div class="hero">
    <div class="logo-plain">
      <img src="images/bryce-canyon-logo.png" alt="Bryce Canyon Stumblers logo">
    </div>
    <h1>Bryce Canyon</h1>
    <p class="tagline">Stumble No. 2</p>
    <div class="date-banner">
      📅 September 2026
    </div>
  </div>

  <div class="container">

    <!-- ===== ABOUT THE RACE =====
         Replace this paragraph with your own write-up. -->
    <section class="section">
      <h2>The Race</h2>
      <div class="info-card" style="max-width: 800px; margin: 0 auto;">
        <p>The second Stumble took the Stumblers to Bryce Canyon, Utah.</p>
      </div>
    </section>

    <!-- ===== PHOTOS =====
         To add a photo: put the file in stirlingstumble/photos/2026-bryce-canyon/
         and copy a <figure> block like this inside <div class="gallery">:
           <figure>
             <img src="photos/2026-bryce-canyon/your-photo.jpg" alt="Short description">
             <figcaption>Caption text</figcaption>
           </figure>
         Then delete the "Photos coming soon" line. -->
    <section class="section">
      <h2>Photos</h2>
      <p class="gallery-empty">Photos coming soon.</p>
      <div class="gallery">
      </div>
    </section>

  </div>

  <div class="tartan-accent"></div>
  <footer>
    <p>&copy; 2026 The Stirling Stumble | Bryce Canyon</p>
    <p style="margin-top: 10px; font-style: italic;">"Run like the wind, stumble with pride!"</p>
  </footer>
</body>
</html>
