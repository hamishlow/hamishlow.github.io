<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="The Greenwich Grind badge: Stumbling On">
  <defs>
    <!-- Circle path for the curved text (top arc and bottom arc) -->
    <path id="arcTop" d="M 60,200 A 140,140 0 0 1 340,200"/>
    <path id="arcBottom" d="M 52,200 A 148,148 0 0 0 348,200"/>
  </defs>

  <!-- Stitched outer edge, like the Stirling patch -->
  <circle cx="200" cy="200" r="196" fill="#f5e6d3"/>
  <circle cx="200" cy="200" r="188" fill="#1b5e3a"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#f5e6d3" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Inner ring -->
  <circle cx="200" cy="200" r="112" fill="#14472c" stroke="#c9a227" stroke-width="4"/>

  <!-- "Stumbling On" around the bottom edge -->
  <text font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="28" font-weight="800"
        letter-spacing="5" fill="#f5e6d3" dominant-baseline="hanging">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">STUMBLING ON</textPath>
  </text>

  <!-- Centre: race name -->
  <g font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-weight="800" text-anchor="middle" fill="#f5e6d3">
    <text x="200" y="172" font-size="26" letter-spacing="3">THE</text>
    <text x="200" y="212" font-size="31" letter-spacing="1">GREENWICH</text>
    <text x="200" y="254" font-size="38" letter-spacing="6" fill="#c9a227">GRIND</text>
  </g>
</svg>
